[package]
name = "seam-core"
description = "Phone connection logic for Seam: tools, adb, scrcpy, and the secure phone link."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only desktop peer. Not a default feature: the desktop app does not ship it.
# scripts/test.sh and CI pass `--features testpeer` explicitly.
testpeer = []

[[bin]]
name = "seam-testpeer"
path = "src/bin/seam-testpeer.rs"
required-features = ["testpeer"]

[[test]]
name = "testpeer"
path = "tests/testpeer.rs"
required-features = ["testpeer"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
base64 = "0.23"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
mdns-sd = "0.13"
url = "=2.5.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
base64 = "0.23"
hex = "0.4"
sha2 = "0.10"
