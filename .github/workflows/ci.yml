name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: write  # lets CI commit an updated Cargo.lock on main
jobs:
  test:
    # PRs the agent opens are tested inside the agent workflow (and again on main).
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install system libraries
        run: bash scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      - name: Test (format, lint, unit tests, build, launch app)
        run: bash scripts/test.sh
      - name: Commit Cargo.lock if it changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock && git commit -m "Update Cargo.lock" && git push origin HEAD:main
          fi
