name: Grok agent
# Fully autonomous: issue -> Grok fix + Grok review -> independent CI -> auto-merge -> release.
#
# Triggers only for issues from the repo owner, or when the owner adds the "agent" label
# to someone else's issue. Issues from strangers never reach Grok (prompt-injection guard).
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re)run the agent on (empty = the next one waiting)
        required: false
  schedule:
    # Safety net: picks up waiting issues if a chain was interrupted.
    - cron: "23 * * * *"
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
# One agent at a time per repo. Extra triggers wait; anything dropped is picked up by
# the "next" job or the hourly schedule, because waiting issues stay open with `agent`.
concurrency:
  group: agent-${{ github.repository }}
  cancel-in-progress: false
jobs:
  pick:
    if: >-
      github.event_name != 'issues' ||
      (github.event.sender.login == github.repository_owner &&
       github.event.issue.state == 'open' &&
       ((github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'agent')) ||
        github.event.label.name == 'agent') &&
       !contains(github.event.issue.labels.*.name, 'no-agent'))
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - name: Choose the issue to work on
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          R=${{ github.repository }}
          # An explicit issue (manual run, or the agent restarting after a conflict) goes first.
          if [ -n "$EXPLICIT_ISSUE" ]; then
            [ "$(gh api repos/$R/issues/$EXPLICIT_ISSUE --jq .state)" = open ] && echo "issue=$EXPLICIT_ISSUE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Otherwise the oldest open `agent` issue, so related issues run in the order they were filed.
          # Skip issues whose last agent attempt ended in a reported failure, unless the `agent`
          # label was (re-)added after that failure.
          for n in $(gh api "repos/$R/issues?state=open&labels=agent&sort=created&direction=asc&per_page=50" \
                       --jq '.[] | select(.pull_request == null) | select([.labels[].name] | index("no-agent") | not) | .number'); do
            # "Depends on #N" in the issue: wait until #N is closed.
            blocked=""
            for d in $(gh api repos/$R/issues/$n --jq '.body // ""' | grep -oiE 'depends on #[0-9]+' | grep -oE '[0-9]+' || true); do
              [ "$(gh api repos/$R/issues/$d --jq .state)" = open ] && blocked="#$d"
            done
            if [ -n "$blocked" ]; then echo "#$n waits for $blocked"; continue; fi
            last=$(gh api "repos/$R/issues/$n/comments?per_page=100" --jq '[.[] | select(.body | startswith("🤖"))] | last // {} | "\(.created_at // "")|\(.body // "")"')
            at=${last%%|*}; body=${last#*|}
            case "$body" in
              "🤖 Grok agent could not"*|"🤖 Grok agent crashed"*|"🤖 xAI rejected"*|*"leaving it for a human"*|"🤖 Grok agent ran out of time"*)
                labeled=$(gh api "repos/$R/issues/$n/events?per_page=100" --jq '[.[] | select(.event == "labeled" and .label.name == "agent")] | last | .created_at // ""')
                [[ "$labeled" > "$at" ]] || continue ;;
            esac
            echo "issue=$n" >> "$GITHUB_OUTPUT"; echo "picked #$n"; exit 0
          done
          echo "nothing waiting"

  fix:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      branch: ${{ steps.agent.outputs.branch }}
      pr: ${{ steps.agent.outputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system libraries
        run: bash scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Load the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ needs.pick.outputs.issue }} \
            | jq '{issue: .}' > "$RUNNER_TEMP/event.json"
          echo "AGENT_EVENT_PATH=$RUNNER_TEMP/event.json" >> "$GITHUB_ENV"
      - name: Hand the tokens to the agent through files
        # Not via the agent's environment: the code it writes runs as child processes.
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/agent-secrets"; mkdir -m 700 "$d"
          printf '%s' "$XAI_API_KEY" > "$d/xai"; printf '%s' "$GH_TOKEN" > "$d/gh"; chmod 600 "$d"/*
          echo "AGENT_SECRETS_DIR=$d" >> "$GITHUB_ENV"
      - name: Grok fixes and reviews
        id: agent
        env:
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          AGENT_MAX_ATTEMPTS: "5"
        run: python3 .github/agent/grok_agent.py

  test:
    needs: fix
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.fix.outputs.branch }}

  merge:
    needs: [fix, test]
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the approved PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/pulls/${{ needs.fix.outputs.pr }}/merge \
            -f merge_method=squash
          gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/${{ needs.fix.outputs.branch }} || true

  release:
    needs: merge
    uses: ./.github/workflows/release.yml
    secrets: inherit

  close-issue:
    needs: [pick, fix, release]
    runs-on: ubuntu-latest
    steps:
      - name: Close the issue with a link to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.pick.outputs.issue }}
        run: |
          gh api repos/${{ github.repository }}/issues/$ISSUE/comments \
            -f body="🤖 Fixed in #${{ needs.fix.outputs.pr }}, merged and released: ${{ needs.release.outputs.url }}"
          gh api -X PATCH repos/${{ github.repository }}/issues/$ISSUE -f state=closed -f state_reason=completed

  next:
    # Hand over to the next waiting issue, whatever happened to this one.
    needs: [pick, fix, test, merge, release, close-issue]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    steps:
      - name: Report a timeout
        if: needs.fix.result == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ needs.pick.outputs.issue }}/comments \
            -f body="🤖 Grok agent ran out of time on this issue. Split it into smaller issues, or remove and re-add the \`agent\` label to try again."
      - name: Report a change that did not make it through CI, merge or release
        if: needs.fix.result == 'success' && needs.close-issue.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ needs.pick.outputs.issue }}/comments \
            -f body="🤖 Grok agent could not finish: PR #${{ needs.fix.outputs.pr }} did not get through CI, merge or release (test: ${{ needs.test.result }}, merge: ${{ needs.merge.result }}). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Start the next waiting issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent.yml -R ${{ github.repository }} --ref main
