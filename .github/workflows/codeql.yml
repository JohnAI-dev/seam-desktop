name: CodeQL
# Static security analysis. Free for public repositories; skipped while the repo is private.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    if: (github.event.repository.private == false) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: ["rust", "javascript-typescript", "actions"]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
