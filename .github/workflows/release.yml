name: Release
# Builds Linux, Mac and Windows on every change to main and publishes a release.
# With the TAURI_SIGNING_PRIVATE_KEY secret set, the release also carries signed update
# files and latest.json, so installed apps update themselves.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/**', '**.md', 'Cargo.lock']
  workflow_call:
    outputs:
      url:
        value: ${{ jobs.publish.outputs.url }}
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - id: v
        # Version = 0.1.<number of commits>, so every release is newer than the last.
        run: |
          echo "version=0.1.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bundles: "deb,appimage", tools: linux-x86_64 }
          - { os: macos-latest, bundles: "app,dmg", tools: macos-aarch64 }
          - { os: windows-latest, bundles: nsis, tools: win64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: bash scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch built-in adb and scrcpy
        run: python scripts/fetch_tools.py ${{ matrix.tools }}
      - name: Sign built-in tools (Mac)
        if: runner.os == 'macOS'
        run: |
          for t in adb scrcpy; do
            codesign --force --sign - --timestamp=none src-tauri/resources/tools/$t
          done
      - name: Set version and updater signing
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          python - <<'PY'
          import json, os
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          c["version"] = os.environ["VERSION"]
          c["bundle"]["createUpdaterArtifacts"] = os.environ["HAS_KEY"] == "true"
          json.dump(c, open(p, "w"), indent=2)
          print("version", c["version"], "updater artifacts", c["bundle"]["createUpdaterArtifacts"])
          PY
      - name: Build installers
        shell: bash
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || unset TAURI_SIGNING_PRIVATE_KEY
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - name: Verify Mac app signature
        if: runner.os == 'macOS'
        run: |
          app=$(find target/release/bundle -maxdepth 3 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::no .app found in target/release/bundle/macos"; exit 1; }
          if ! out=$(codesign --verify --deep --strict --verbose=2 "$app" 2>&1); then
            echo "$out"
            echo "::error title=Mac signature invalid::$(echo "$out" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          for t in adb scrcpy; do
            f="$app/Contents/Resources/tools/$t"
            test -x "$f" || { echo "::error::$t missing or not executable in the app"; exit 1; }
            "$f" --version >/dev/null 2>&1 || "$f" version >/dev/null 2>&1 || { echo "::error::built-in $t does not run on macOS"; exit 1; }
          done
          echo "Mac app is signed and its built-in tools run"
      - uses: actions/upload-artifact@v4
        with:
          name: seam-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # Publish whatever platforms built, even if one of them failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.rel.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          tag="v$VERSION"
          python3 scripts/make_latest_json.py dist "$VERSION" "$tag" "${{ github.repository }}" || true
          mapfile -t files < <(find dist -type f)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No platform built successfully"; exit 1; fi
          printf "  %s\n" "${files[@]}"
          cat > notes.md <<'NOTES'
          **Install** (first time only; after that Seam updates itself):
          - **Mac (Apple Silicon):** open the `.dmg` and drag Seam to Applications. The first time, macOS asks about an unverified developer: System Settings → Privacy & Security → Open Anyway.
          - **Linux (incl. Arch):** run the `.AppImage` (it updates itself), or install the `.deb` (Debian/Ubuntu).
          - **Windows:** run the `-setup.exe`. Windows may warn about an unknown publisher: More info → Run anyway.

          adb and scrcpy are built in; nothing else to install.
          NOTES
          sed -i 's/^          //' notes.md
          url=$(gh release create "$tag" "${files[@]}" --repo ${{ github.repository }} --target "$SHA" \
                --title "Seam $VERSION" --notes-file notes.md --latest)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Released: $url"
