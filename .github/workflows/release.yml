name: Release
# Builds Linux, Mac and Windows on every push to main. Publishes a release when
# shippable app code changed since the newest merged v* tag that has a GitHub
# Release. With the TAURI_SIGNING_PRIVATE_KEY secret set, the release also
# carries signed update files and latest.json, so installed apps update themselves.
on:
  push:
    branches: [main]
    # Cargo.lock is not ignored: a lockfile-only update can change the app.
    # The publish gate separates runtime dependencies from dev-dependencies.
    # Docs and workflow-only pushes still skip this workflow entirely.
    paths-ignore: ['.github/**', '**.md']
  workflow_call:
    outputs:
      # agent.yml posts this string after "released: ". A skipped publish has
      # no url; say so instead of leaving the link empty. `&&` yields the url
      # when the job succeeded, otherwise the fallback.
      url:
        value: ${{ jobs.publish.result == 'success' && jobs.publish.outputs.url || 'no release was made' }}
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: v
        # Version = 0.1.<commit count>. A skipped publish does not create a tag,
        # so the next publish's count is strictly higher. Gaps are expected.
        run: |
          echo "version=0.1.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan, gate]
    # Skip the matrix only when the gate is sure nothing ships. A failed or
    # cancelled plan does not build. A failed gate, a missing output, or a
    # manual dispatch still builds (fail-open). One red platform does not
    # block the others or the publish job.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.result != 'success' || needs.gate.outputs.publish != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bundles: "deb,appimage", tools: linux-x86_64 }
          - { os: macos-latest, bundles: "app,dmg", tools: macos-aarch64 }
          - { os: windows-latest, bundles: nsis, tools: win64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: bash scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch built-in adb and scrcpy
        run: python scripts/fetch_tools.py ${{ matrix.tools }}
      - name: Sign built-in tools (Mac)
        if: runner.os == 'macOS'
        run: |
          for t in adb scrcpy; do
            codesign --force --sign - --timestamp=none src-tauri/resources/tools/$t
          done
      - name: Set version and updater signing
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          python - <<'PY'
          import json, os
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          c["version"] = os.environ["VERSION"]
          has_key = os.environ["HAS_KEY"] == "true"
          if c["plugins"]["updater"].get("pubkey") and not has_key:
              # Installed apps only update from releases with signed update files.
              raise SystemExit("::error title=Missing updater key::TAURI_SIGNING_PRIVATE_KEY is not "
                               "available to this run (a workflow_call needs `secrets: inherit`)")
          c["bundle"]["createUpdaterArtifacts"] = has_key
          json.dump(c, open(p, "w"), indent=2)
          print("version", c["version"], "updater artifacts", c["bundle"]["createUpdaterArtifacts"])
          PY
      - name: Build installers
        shell: bash
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || unset TAURI_SIGNING_PRIVATE_KEY
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - name: Verify Mac app signature
        if: runner.os == 'macOS'
        run: |
          app=$(find target/release/bundle -maxdepth 3 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::no .app found in target/release/bundle/macos"; exit 1; }
          if ! out=$(codesign --verify --deep --strict --verbose=2 "$app" 2>&1); then
            echo "$out"
            echo "::error title=Mac signature invalid::$(echo "$out" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          for t in adb scrcpy; do
            f="$app/Contents/Resources/tools/$t"
            test -x "$f" || { echo "::error::$t missing or not executable in the app"; exit 1; }
            "$f" --version >/dev/null 2>&1 || "$f" version >/dev/null 2>&1 || { echo "::error::built-in $t does not run on macOS"; exit 1; }
          done
          echo "Mac app is signed and its built-in tools run"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seam-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  gate:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch release tags
        run: git fetch origin --tags --force || echo "::warning title=Tag fetch failed::using tags already present"
      - name: Decide whether this commit ships app code
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/publish_gate.py
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Publish gate failed open::publish_gate.py exited $code"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif ! grep -qx 'publish=true' "$GITHUB_OUTPUT" && ! grep -qx 'publish=false' "$GITHUB_OUTPUT"; then
            echo "::warning title=Publish gate failed open::no publish output"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [plan, build, gate]
    # Publish whatever platforms built, even if one of them failed.
    # Skip only when the gate is sure nothing shippable changed. A failed gate,
    # a missing or unexpected output, or a manual workflow_dispatch still
    # publishes. `!= 'false'` matches the build job so an empty output fails open.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.result != 'success' || needs.gate.outputs.publish != 'false') }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.rel.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          tag="v$VERSION"
          python3 scripts/make_latest_json.py dist "$VERSION" "$tag" "${{ github.repository }}" || true
          mapfile -t files < <(find dist -type f)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No platform built successfully"; exit 1; fi
          printf "  %s\n" "${files[@]}"
          cat > notes.md <<'NOTES'
          **Install** (first time only; after that Seam updates itself):
          - **Mac (Apple Silicon):** open the `.dmg` and drag Seam to Applications. The first time, macOS asks about an unverified developer: System Settings → Privacy & Security → Open Anyway.
          - **Linux (incl. Arch):** run the `.AppImage` (it updates itself), or install the `.deb` (Debian/Ubuntu).
          - **Windows:** run the `-setup.exe`. Windows may warn about an unknown publisher: More info → Run anyway.

          adb and scrcpy are built in; nothing else to install.
          NOTES
          sed -i 's/^          //' notes.md
          if [ "$(printf "%s\n" "${files[@]}" | xargs -n1 basename | sort | uniq -d)" ]; then
            echo "::error title=Duplicate asset names::$(printf "%s\n" "${files[@]}" | xargs -n1 basename | sort | uniq -d | tr '\n' ' ')"
          fi
          for try in 1 2 3; do
            if url=$(gh release create "$tag" "${files[@]}" --repo ${{ github.repository }} --target "$SHA" \
                  --title "Seam $VERSION" --notes-file notes.md --latest 2>err.txt); then break; fi
            echo "::warning title=Release attempt $try failed::$(tr '\n' ' ' < err.txt | cut -c1-500)"
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
            [ $try = 3 ] && { echo "::error title=Release failed::$(tr '\n' ' ' < err.txt | cut -c1-500)"; exit 1; }
            sleep 20
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Released: $url"
