name: Release
# Linux builds (.deb + AppImage) on every change to main.
# Mac and Windows builds only when run by hand with "all platforms" ticked,
# since those build machines cost 2-10x more minutes.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/**', '**.md', 'Cargo.lock']
  workflow_call:
    outputs:
      url:
        value: ${{ jobs.publish.outputs.url }}
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Also build Mac and Windows
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          linux='{"os":"ubuntu-24.04","bundles":"deb,appimage","tools":"linux-x86_64"}'
          mac='{"os":"macos-latest","bundles":"dmg","tools":"macos-aarch64"}'
          win='{"os":"windows-latest","bundles":"nsis","tools":"win64"}'
          if [ "${{ inputs.all_platforms }}" = "true" ]; then
            echo "matrix={\"include\":[$linux,$mac,$win]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: bash scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch built-in adb and scrcpy
        run: python scripts/fetch_tools.py ${{ matrix.tools }}
      - name: Build installers
        shell: bash
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: seam-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    # Publish whatever platforms built, even if one of them failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.rel.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          tag="build-$(date -u +%Y%m%d-%H%M%S)-${sha:0:7}"
          mapfile -t files < <(find dist -type f)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No platform built successfully"; exit 1; fi
          printf "  %s\n" "${files[@]}"
          url=$(gh release create "$tag" "${files[@]}" --repo ${{ github.repository }} --target "$sha" \
                --title "Seam $(date -u +%Y-%m-%d) (${sha:0:7})" \
                --notes "Automatic build of main at ${sha:0:7}.

          - **Linux:** run the .AppImage (any distro, incl. Arch) or install the .deb (Debian/Ubuntu).
          - **Mac (Apple Silicon):** open the .dmg and drag Seam to Applications. The app is not signed yet, so the first time: right-click Seam → Open → Open.
          - **Windows:** run the -setup.exe. Windows may warn about an unknown publisher: More info → Run anyway.

          adb and scrcpy are built in; nothing else to install.")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Released: $url"
