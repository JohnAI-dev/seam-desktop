name: Release
# Linux builds (.deb + AppImage) on every change to main.
# Mac and Windows builds only when run by hand with "all platforms" ticked,
# since those build machines cost 2-10x more minutes.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/**', '**.md', 'Cargo.lock']
  workflow_call:
    outputs:
      url:
        value: ${{ jobs.publish.outputs.url }}
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Also build Mac and Windows
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          linux='{"os":"ubuntu-24.04","bundles":"deb,appimage"}'
          if [ "${{ inputs.all_platforms }}" = "true" ]; then
            echo "matrix={\"include\":[$linux,{\"os\":\"macos-latest\",\"bundles\":\"dmg\"},{\"os\":\"windows-latest\",\"bundles\":\"nsis\"}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: bash scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build installers
        shell: bash
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: seam-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.rel.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          tag="build-$(date -u +%Y%m%d-%H%M%S)-${sha:0:7}"
          url=$(gh release create "$tag" dist/* --repo ${{ github.repository }} --target "$sha" \
                --title "Seam $(date -u +%Y-%m-%d) (${sha:0:7})" \
                --notes "Automatic build of main at ${sha:0:7}. Install the .deb (Debian/Ubuntu) or run the .AppImage (any Linux, incl. Arch).")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Released: $url"
